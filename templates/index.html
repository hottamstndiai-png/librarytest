<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>図書貸し出しシステム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .auth-section, .main-section {
            margin-bottom: 30px;
        }
        .auth-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .auth-card {
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        .auth-card h2 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .user-info.show {
            display: block;
        }
        .user-info strong {
            color: #1976d2;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab {
            padding: 12px 25px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .book-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .book-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .book-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .book-card p {
            color: #666;
            margin-bottom: 8px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
        }
        .status-available {
            background: #4caf50;
            color: white;
        }
        .status-borrowed {
            background: #ff9800;
            color: white;
        }
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .hidden {
            display: none;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-danger {
            background: #dc3545;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-buttons button {
            flex: 1;
            padding: 8px 15px;
            font-size: 0.9em;
        }
        .borrow-record {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .overdue {
            border-color: #dc3545;
            background: #fff5f5;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .filter-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .category-section {
            margin-bottom: 30px;
        }
        .category-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            margin-bottom: 15px;
        }
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 図書貸し出しシステム</h1>
            <p>Library Management System</p>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- 認証セクション -->
            <div id="authSection" class="auth-section">
                <div class="auth-card">
                    <h2>ログイン</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>ユーザー名</label>
                            <input type="text" id="loginUsername" required>
                        </div>
                        <div class="form-group">
                            <label>パスワード</label>
                            <input type="password" id="loginPassword" required>
                        </div>
                        <button type="submit">ログイン</button>
                    </form>
                    <p style="margin-top: 15px; color: #666; font-size: 0.9em;">
                        テストユーザー: tanaka / password123<br>
                        管理者: admin / admin123
                    </p>
                </div>

                <div class="auth-card">
                    <h2>新規登録</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label>ユーザー名</label>
                            <input type="text" id="registerUsername" required>
                        </div>
                        <div class="form-group">
                            <label>パスワード</label>
                            <input type="password" id="registerPassword" required>
                        </div>
                        <button type="submit">登録</button>
                    </form>
                </div>
            </div>

            <!-- ユーザー情報 -->
            <div id="userInfo" class="user-info">
                <p><strong>ログイン中:</strong> <span id="currentUser"></span></p>
                <p><strong>権限:</strong> <span id="userRole"></span></p>
                <button onclick="logout()">ログアウト</button>
            </div>

            <!-- メインセクション -->
            <div id="mainSection" class="main-section hidden">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('books')">本の一覧</button>
                    <button class="tab" onclick="switchTab('mybooks')">貸出状況</button>
                    <button class="tab" onclick="switchTab('history')">貸出履歴</button>
                    <button class="tab" id="adminTab" onclick="switchTab('admin')" style="display:none">管理</button>
                </div>

                <!-- 本の一覧タブ -->
                <div id="booksTab" class="tab-content active">
                    <h2>本の一覧</h2>

                    <!-- 検索ボックス -->
                    <input type="text" id="searchBox" class="search-box" placeholder="本のタイトルで検索...">

                    <!-- ステータスフィルター -->
                    <div class="filter-section">
                        <h3>ステータスで絞り込み</h3>
                        <div class="filter-buttons">
                            <button class="filter-btn active" onclick="filterByStatus('all')">すべて</button>
                            <button class="filter-btn" onclick="filterByStatus('available')">利用可能のみ</button>
                            <button class="filter-btn" onclick="filterByStatus('borrowed')">貸出中のみ</button>
                        </div>
                    </div>

                    <!-- 著者フィルター -->
                    <div class="filter-section">
                        <h3>著者で絞り込み</h3>
                        <div id="authorFilters" class="filter-buttons"></div>
                    </div>

                    <!-- 表示方法選択 -->
                    <div class="filter-section">
                        <h3>表示方法</h3>
                        <div class="filter-buttons">
                            <button class="filter-btn active" onclick="changeViewMode('all')">すべて表示</button>
                            <button class="filter-btn" onclick="changeViewMode('author')">著者ごとに分類</button>
                        </div>
                    </div>

                    <!-- 本の一覧 -->
                    <div id="bookList" class="book-list"></div>

                    <!-- 著者ごとの表示 -->
                    <div id="booksByAuthor" class="hidden"></div>
                </div>

                <!-- 貸出状況タブ -->
                <div id="mybooksTab" class="tab-content">
                    <h2>現在の貸出状況</h2>
                    <div id="myBorrowList"></div>
                </div>

                <!-- 貸出履歴タブ -->
                <div id="historyTab" class="tab-content">
                    <h2>貸出履歴</h2>
                    <div id="historyList"></div>
                </div>

                <!-- 管理タブ -->
                <div id="adminTab" class="tab-content">
                    <h2>本の管理（管理者のみ）</h2>
                    <div class="auth-card">
                        <h3>新しい本を追加</h3>
                        <form id="addBookForm">
                            <div class="form-group">
                                <label>タイトル</label>
                                <input type="text" id="bookTitle" required>
                            </div>
                            <div class="form-group">
                                <label>著者</label>
                                <input type="text" id="bookAuthor" required>
                            </div>
                            <button type="submit">本を追加</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let currentUser = null;
        let isAdmin = false;
        let allBooks = [];
        let currentStatusFilter = 'all';
        let currentAuthorFilter = 'all';
        let currentViewMode = 'all';

        // ログイン
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    isAdmin = data.user.is_admin;
                    showMessage('ログインに成功しました！', 'success');
                    showMainSection();
                    loadBooks();
                } else {
                    showMessage(data.error || 'ログインに失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        });

        // 新規登録
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('登録に成功しました！ログインしてください。', 'success');
                    document.getElementById('registerForm').reset();
                } else {
                    showMessage(data.error || '登録に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        });

        // ログアウト
        async function logout() {
            try {
                await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                currentUser = null;
                isAdmin = false;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainSection').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('show');
                showMessage('ログアウトしました', 'success');
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        }

        // メインセクション表示
        function showMainSection() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('show');
            document.getElementById('currentUser').textContent = currentUser.username;
            document.getElementById('userRole').textContent = isAdmin ? '管理者' : '一般ユーザー';

            if (isAdmin) {
                document.getElementById('adminTab').style.display = 'block';
            }
        }

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');

            if (tabName === 'books') loadBooks();
            if (tabName === 'mybooks') loadMyBorrows();
            if (tabName === 'history') loadHistory();
        }

        // 本の一覧を読み込み
        async function loadBooks() {
            try {
                const response = await fetch(`${API_BASE}/books`, {
                    credentials: 'include'
                });
                const data = await response.json();

                allBooks = data.books;
                setupAuthorFilters();
                setupSearchBox();
                displayBooks();
            } catch (error) {
                showMessage('本の一覧の読み込みに失敗しました', 'error');
            }
        }

        // 著者フィルターボタンを設定
        function setupAuthorFilters() {
            const authors = [...new Set(allBooks.map(book => book.author))];
            const authorFiltersDiv = document.getElementById('authorFilters');

            authorFiltersDiv.innerHTML = '<button class="filter-btn active" onclick="filterByAuthor(\'all\')">すべての著者</button>';

            authors.forEach(author => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = author;
                btn.onclick = () => filterByAuthor(author);
                authorFiltersDiv.appendChild(btn);
            });
        }

        // 検索ボックスを設定
        function setupSearchBox() {
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', (e) => {
                displayBooks(e.target.value);
            });
        }

        // ステータスでフィルター
        function filterByStatus(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-section:nth-child(2) .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayBooks();
        }

        // 著者でフィルター
        function filterByAuthor(author) {
            currentAuthorFilter = author;
            document.querySelectorAll('#authorFilters .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayBooks();
        }

        // 表示方法を変更
        function changeViewMode(mode) {
            currentViewMode = mode;
            document.querySelectorAll('.filter-section:last-child .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayBooks();
        }

        // 本を表示
        function displayBooks(searchTerm = '') {
            let filteredBooks = allBooks;

            // ステータスでフィルター
            if (currentStatusFilter !== 'all') {
                filteredBooks = filteredBooks.filter(book => book.status === currentStatusFilter);
            }

            // 著者でフィルター
            if (currentAuthorFilter !== 'all') {
                filteredBooks = filteredBooks.filter(book => book.author === currentAuthorFilter);
            }

            // 検索語でフィルター
            if (searchTerm) {
                filteredBooks = filteredBooks.filter(book =>
                    book.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (currentViewMode === 'all') {
                displayBooksAsList(filteredBooks);
            } else {
                displayBooksByAuthor(filteredBooks);
            }
        }

        // 通常の一覧表示
        function displayBooksAsList(books) {
            const bookList = document.getElementById('bookList');
            const booksByAuthor = document.getElementById('booksByAuthor');

            bookList.classList.remove('hidden');
            booksByAuthor.classList.add('hidden');
            bookList.innerHTML = '';

            if (books.length === 0) {
                bookList.innerHTML = '<p>該当する本がありません</p>';
                return;
            }

            books.forEach(book => {
                bookList.appendChild(createBookCard(book));
            });
        }

        // 著者ごとに分類して表示
        function displayBooksByAuthor(books) {
            const bookList = document.getElementById('bookList');
            const booksByAuthor = document.getElementById('booksByAuthor');

            bookList.classList.add('hidden');
            booksByAuthor.classList.remove('hidden');
            booksByAuthor.innerHTML = '';

            if (books.length === 0) {
                booksByAuthor.innerHTML = '<p>該当する本がありません</p>';
                return;
            }

            // 著者ごとにグループ化
            const booksByAuthorMap = {};
            books.forEach(book => {
                if (!booksByAuthorMap[book.author]) {
                    booksByAuthorMap[book.author] = [];
                }
                booksByAuthorMap[book.author].push(book);
            });

            // 著者ごとに表示
            Object.keys(booksByAuthorMap).sort().forEach(author => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';

                const heading = document.createElement('h3');
                heading.textContent = `${author} (${booksByAuthorMap[author].length}冊)`;
                categorySection.appendChild(heading);

                const bookGrid = document.createElement('div');
                bookGrid.className = 'book-list';

                booksByAuthorMap[author].forEach(book => {
                    bookGrid.appendChild(createBookCard(book));
                });

                categorySection.appendChild(bookGrid);
                booksByAuthor.appendChild(categorySection);
            });
        }

        // 本のカードを作成
        function createBookCard(book) {
            const bookCard = document.createElement('div');
            bookCard.className = 'book-card';
            bookCard.innerHTML = `
                <h3>${book.title}</h3>
                <p><strong>著者:</strong> ${book.author}</p>
                <p><strong>ID:</strong> ${book.book_id}</p>
                <span class="status-badge status-${book.status === 'available' ? 'available' : 'borrowed'}">
                    ${book.status === 'available' ? '利用可能' : '貸出中'}
                </span>
                ${book.status === 'available' ? `
                    <div class="action-buttons">
                        <button onclick="borrowBook(${book.book_id})">借りる</button>
                    </div>
                ` : ''}
            `;
            return bookCard;
        }

        // 本を借りる
        async function borrowBook(bookId) {
            try {
                const response = await fetch(`${API_BASE}/borrow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('本を借りました！', 'success');
                    await loadBooks();
                } else {
                    showMessage(data.error || '貸出に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        }

        // 本を返す
        async function returnBook(bookId) {
            try {
                const response = await fetch(`${API_BASE}/return`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('本を返却しました！', 'success');
                    loadMyBorrows();
                    loadBooks();
                } else {
                    showMessage(data.error || '返却に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        }

        // 自分の貸出状況を読み込み
        async function loadMyBorrows() {
            try {
                const response = await fetch(`${API_BASE}/status/user/${currentUser.user_id}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const borrowList = document.getElementById('myBorrowList');
                borrowList.innerHTML = '';

                if (data.borrows.length === 0) {
                    borrowList.innerHTML = '<p>現在借りている本はありません</p>';
                    return;
                }

                data.borrows.forEach(record => {
                    const borrowCard = document.createElement('div');
                    borrowCard.className = 'borrow-record' + (record.is_overdue ? ' overdue' : '');
                    const dueDate = new Date(record.due_date).toLocaleDateString('ja-JP');

                    borrowCard.innerHTML = `
                        <h3>${record.book.title}</h3>
                        <p><strong>著者:</strong> ${record.book.author}</p>
                        <p><strong>返却期限:</strong> ${dueDate} ${record.is_overdue ? '(期限切れ!)' : ''}</p>
                        <div class="action-buttons">
                            <button onclick="returnBook(${record.book_id})">返却する</button>
                        </div>
                    `;
                    borrowList.appendChild(borrowCard);
                });
            } catch (error) {
                showMessage('貸出状況の読み込みに失敗しました', 'error');
            }
        }

        // 貸出履歴を読み込み
        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/status/history?user_id=${currentUser.user_id}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';

                if (data.history.length === 0) {
                    historyList.innerHTML = '<p>履歴がありません</p>';
                    return;
                }

                data.history.forEach(record => {
                    const historyCard = document.createElement('div');
                    historyCard.className = 'borrow-record';
                    const borrowDate = new Date(record.borrow_date).toLocaleDateString('ja-JP');
                    const returnDate = record.return_date ? new Date(record.return_date).toLocaleDateString('ja-JP') : '未返却';

                    historyCard.innerHTML = `
                        <h3>${record.book.title}</h3>
                        <p><strong>著者:</strong> ${record.book.author}</p>
                        <p><strong>貸出日:</strong> ${borrowDate}</p>
                        <p><strong>返却日:</strong> ${returnDate}</p>
                    `;
                    historyList.appendChild(historyCard);
                });
            } catch (error) {
                showMessage('履歴の読み込みに失敗しました', 'error');
            }
        }

        // 本を追加（管理者のみ）
        document.getElementById('addBookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('bookAuthor').value;

            try {
                const response = await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('本を追加しました！', 'success');
                    document.getElementById('addBookForm').reset();
                    switchTab('books');
                } else {
                    showMessage(data.error || '本の追加に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            }
        });

        // メッセージ表示
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
